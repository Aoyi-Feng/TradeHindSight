[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
license = {text = "MIT"}
name = "backtest-engine"
version = "0.1.0"
description = "A leakage-free backtest engine: strategy injected, data guarded, fast and rigorous modes."
requires-python = ">=3.11"
dependencies = ["numpy>=1.26", "pandas>=2.1"]

[project.optional-dependencies]
yaml = ["pyyaml>=6"]
dev = ["pytest>=8"]

[project.scripts]
tradehindsight = "tradehindsight.cli:main"

[tool.setuptools]
packages = ["tradehindsight", "strategies"]
